{% extends 'layout.html' %}

{% block title %}구구단 결과{% endblock %}

{% block content %}
    {% if error %}
        <h1>입력을 확인해 주세요</h1>
        <p class="error">{{ error }}</p>
    {% else %}
        <h1>구구단 {{ dan }}단 결과</h1>
        <ul class="result-list">
            {% for row in rows %}
                <li>{{ dan }} × {{ row.number }} = {{ row.result }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    <a class="back-link" href="{{ url_for('index') }}">다시 입력하기</a>
{% endblock %}
