{% extends 'layout.html' %}

{% block content %}
    <section class="card">
        <h2>최근 글</h2>
        {% if posts %}
            <ul>
                {% for post in posts %}
                    <li>{{ post }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>아직 작성된 글이 없습니다.</p>
        {% endif %}
    </section>
    <section class="card">
        <h2>한 줄 기록</h2>
        <p>아직은 많이 부족하지만, 하나씩 배우면서 발전하고 있습니다.</p>
    </section>
{% endblock %}
