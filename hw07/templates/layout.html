<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ description }}">
    <title>{{ title }} | Zoe Yang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="nav-shell" aria-label="주요 메뉴">
            <a class="brand" href="{{ url_for('index') }}">ZOE<span>.</span></a>
            <div class="nav-links">
                <a{% if active_page == 'home' %} class="active" aria-current="page"{% endif %} href="{{ url_for('index') }}">Home</a>
                <a{% if active_page == 'about' %} class="active" aria-current="page"{% endif %} href="{{ url_for('about') }}">About Me</a>
                <a{% if active_page == 'blog' %} class="active" aria-current="page"{% endif %} href="{{ url_for('blog') }}">Blog</a>
            </div>
        </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">
        <div class="page-shell footer-inner">
            <p>© 2026 Zoe Yang</p>
            <p>{% block footer_text %}Smart Farm · Software · Cooperation{% endblock %}</p>
        </div>
    </footer>
</body>
</html>
