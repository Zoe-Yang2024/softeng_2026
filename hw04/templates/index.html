<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 04 - Python Web Tools</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header class="hero">
        <p class="eyebrow">응용소프트웨어개발 · Assignment 04</p>
        <h1>Python Web Tools</h1>
        <p>Flask, HTML, CSS와 AJAX로 만든 간단한 웹 애플리케이션입니다.</p>
    </header>

    <main class="tool-grid">
        <section class="tool-card">
            <div class="tool-number">01</div>
            <h2>구구단 출력</h2>
            <p>2부터 9 사이의 단을 입력하면 구구단을 표로 출력합니다.</p>

            <form id="gugudan-form" action="{{ url_for('gugudan') }}">
                <label for="dan">단</label>
                <input id="dan" name="dan" type="number" min="2" max="9" value="7" required>
                <button type="submit">구구단 만들기</button>
            </form>

            <div id="gugudan-result" class="result" aria-live="polite">
                결과가 여기에 표시됩니다.
            </div>
        </section>

        <section class="tool-card">
            <div class="tool-number">02</div>
            <h2>BMI 계산기</h2>
            <p>키와 몸무게를 입력하면 BMI 값과 구분을 계산합니다.</p>

            <form id="bmi-form" action="{{ url_for('bmi') }}">
                <label for="height">키 (cm)</label>
                <input id="height" name="height" type="number" min="1" max="300" step="0.1" placeholder="예: 170" required>

                <label for="weight">몸무게 (kg)</label>
                <input id="weight" name="weight" type="number" min="1" max="500" step="0.1" placeholder="예: 65" required>

                <button type="submit">BMI 계산하기</button>
            </form>

            <div id="bmi-result" class="result" aria-live="polite">
                결과가 여기에 표시됩니다.
            </div>
        </section>
    </main>

    <footer>
        <p>주조양 · 202420921 · OpenAI Codex 사용 내역은 README에 기록</p>
    </footer>
</body>
</html>
