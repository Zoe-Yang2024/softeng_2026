{% load static %}
<!doctype html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Assignment 11 Todo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>
<body>

        <a class="brand" href="{% url 'todo:index' %}">My Todo</a>

</html>
