<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flask와 Pandas로 CSV 내용을 보여주는 Assignment 09">
    <title>{{ title }} | Zoe Yang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="bg-white border-bottom">
        <nav class="navbar navbar-light container py-3" aria-label="주요 메뉴">
            <a class="navbar-brand font-weight-bold" href="{{ url_for('index') }}">ZOE<span class="text-primary">.CSV</span></a>
            <div class="nav nav-pills">
                <a class="nav-link{% if active_page == 'home' %} active{% endif %}" href="{{ url_for('index') }}">CSV Blog</a>
                <a class="nav-link{% if active_page == 'about' %} active{% endif %}" href="{{ url_for('about') }}">About</a>
            </div>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="mt-auto py-4 bg-dark text-white">
        <div class="container text-center">© 2026 Zoe Yang · Assignment 09</div>
    </footer>
</body>
</html>
